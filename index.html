<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UG LIVE - InfinityPlayX</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.top{padding:12px;background:#141414;position:sticky;top:0;z-index:9;display:flex;gap:10px;align-items:center}
.top b{color:#ff2a2a}
input{flex:1;padding:10px;border-radius:8px;border:0;background:#222;color:#fff}
#player{width:100%;height:210px;background:#000;border:0}
.cats{display:flex;gap:8px;overflow:auto;padding:10px}
.c{padding:8px 14px;background:#1f1f1f;border-radius:20px;white-space:nowrap;font-size:13px}
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#161616;border-radius:12px;padding:12px;text-align:center;border:1px solid #222}
.card b{font-size:13px}
.live{color:#ff2a2a;font-size:10px;margin-top:4px}
</style>
</head>
<body>
<div class="top"><b>UG LIVE TV</b><input id="q" placeholder="Search NTV, Wan Luo..."></div>
<iframe id="player" src="https://www.youtube-nocookie.com/embed/8wI2Vv2W4hU?autoplay=1&mute=0" allowfullscreen allow="autoplay"></iframe>
<div class="cats"><div class="c" onclick="filter('')">All</div><div class="c" onclick="filter('NTV')">NTV</div><div class="c" onclick="filter('Bukedde')">Bukedde</div><div class="c" onclick="filter('UBC')">UBC</div><div class="c" onclick="filter('Wan')">Wan Luo</div></div>
<div class="grid" id="list"></div>
<script>
let ch=[
{n:"NTV Uganda LIVE",id:"8wI2Vv2W4hU"},
{n:"Bukedde TV LIVE",id:"uJ2y9q5iK7s"},
{n:"UBC TV Uganda",id:"t9n1D2uXv7c"},
{n:"Wan Luo TV - Acholi",id:"dQw4w9WgXcQ"},
{n:"Baba TV Uganda",id:"5qap5aO4i9A"},
{n:"Spark TV Uganda",id:"9bZkp7q19f0"}
];
let player=document.getElementById('player');
let list=document.getElementById('list');
function render(a){list.innerHTML='';a.forEach(c=>{let d=document.createElement('div');d.className='card';d.innerHTML='<b>'+c.n+'</b><div class=live>● LIVE - Tap to Play</div>';d.onclick=()=>{player.src='https://www.youtube-nocookie.com/embed/'+c.id+'?autoplay=1&mute=0';window.scrollTo(0,0)};list.appendChild(d)})}
render(ch);
document.getElementById('q').oninput=e=>{let v=e.target.value.toLowerCase();render(ch.filter(x=>x.n.toLowerCase().includes(v)))};
function filter(t){render(ch.filter(x=>x.n.toLowerCase().includes(t.toLowerCase())))}
</script>
</body>
</html>
