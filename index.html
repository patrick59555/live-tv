<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thrill Fashion Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff7f9} header{background:#000;color:#fff;padding:12px;display:flex;gap:10px;position:sticky;top:0;z-index:9}
header b span{color:#ff2a6d} input{flex:1;padding:11px;border-radius:20px;border:0;background:#222;color:#fff}
.hero{padding:0} .hero img{width:100%;height:200px;object-fit:cover}
.tags{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:50px}
.tags b{background:#ffe4ea;padding:8px 14px;border-radius:20px;font-size:12px;white-space:nowrap}
.tags b.active{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.1);border:1px solid #ffe0e8}
.card img{width:100%;height:200px;object-fit:cover}
.info{padding:10px} .info h4{font-size:12px;height:30px;overflow:hidden}
.price{color:#ff2a6d;font-weight:bold;font-size:14px} .old{color:#999;text-decoration:line-through;font-size:11px;margin-left:5px}
.order{width:100%;background:#25D366;color:#fff;border:0;padding:10px;border-radius:10px;font-weight:bold;margin-top:6px;font-size:12px}
.footer{background:#000;color:#aaa;padding:20px;text-align:center;font-size:12px;line-height:1.6}
.wa{position:fixed;bottom:16px;right:16px;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:99}
</style>
</head>
<body>
<header><b>THRILL <span>FASHION</span></b><input id="s" placeholder="Search abaya, sweater..."></header>

<div class="hero">
<img src="https://raw.githubusercontent.com/patrick59555/live-tv/main/banner.jpg" onerror="this.style.display='none'">
</div>

<div class="tags">
<b class="active" onclick="f('',this)">All</b>
<b onclick="f('abaya',this)">Abaya</b>
<b onclick="f('sweater',this)">Sweaters</b>
<b onclick="f('skirt',this)">Skirts</b>
<b onclick="f('trouser',this)">Trousers</b>
</div>

<div class="grid" id="grid"></div>

<a class="wa" href="https://wa.me/256792350799?text=Hello%20Thrill%20Fashion%20Store!" target="_blank">💬</a>

<div class="footer">
<b style="color:#ff2a6d">THRILL FASHION STORE</b><br>
📞 +256 792 350799 | Kampala Delivery Everywhere<br>
Dresses • Abaya • Sweaters • Ponchos • Skirts • Trousers<br>
Pay on Delivery | MTN MoMo Accepted<br><br>
© 2026 Thrill Fashion Store
</div>

<script>
let items=[
{n:"Maroon Dubai Abaya - Gold Embroidery",p:"UGX 145,000",old:"180,000",c:"abaya",img:"abaya.jpg"},
{n:"Beige Fur Sweater - Warm Ladies",p:"UGX 85,000",old:"110,000",c:"sweater",img:"sweater.jpg"},
{n:"Pleated Skirt - Gold & White Wave",p:"UGX 65,000",old:"85,000",c:"skirt",img:"skirt.jpg"},
{n:"Cargo Jeans - Ladies Trousers Mix",p:"UGX 70,000",old:"90,000",c:"trouser",img:"trousers.jpg"},
{n:"Black Abaya - Classic",p:"UGX 130,000",old:"160k",c:"abaya",img:"abaya.jpg"},
{n:"Wool Sweater - Plus Size",p:"UGX 75,000",old:"95k",c:"sweater",img:"sweater.jpg"},
{n:"Long Skirt - Ankara",p:"UGX 60,000",old:"",c:"skirt",img:"skirt.jpg"},
{n:"Jeans Trousers - High Waist",p:"UGX 68,000",old:"",c:"trouser",img:"trousers.jpg"}
];
let grid=document.getElementById('grid');
function f(q,el){
if(el){document.querySelectorAll('.tags b').forEach(b=>b.classList.remove('active'));el.classList.add('active')}
grid.innerHTML='';
items.filter(i=>q==''||i.c.includes(q)||i.n.toLowerCase().includes(q.toLowerCase())).forEach(it=>{
let msg=`Hello Thrill Fashion Store! I want: ${it.n} - ${it.p}`;
let d=document.createElement('div');d.className='card';
d.innerHTML=`<img src="${it.img}"><div class="info"><h4>${it.n}</h4><div><span class="price">${it.p}</span><span class="old">${it.old}</span></div><button class="order" onclick="window.open('https://wa.me/256792350799?text=${encodeURIComponent(msg)}','_blank')">Order WhatsApp</button></div>`;
grid.appendChild(d);
});
}
f(''); document.getElementById('s').oninput=e=>f(e.target.value);
</script>
</body>
</html>
