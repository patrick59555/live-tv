<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thrill Fashion Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f2f2f2}
header{background:#000;color:#fff;padding:14px;display:flex;gap:10px;align-items:center}
header b{font-size:18px} header b span{color:#ff2a6d}
header input{flex:1;padding:12px;border-radius:20px;border:0;background:#222;color:#fff}
.tags{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff}
.tags b{background:#ffe4ea;padding:8px 14px;border-radius:20px;font-size:12px;white-space:nowrap}
.tags b.active{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;min-height:200px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #eee;position:relative}
.card img{width:100%;height:220px;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;padding:5px 8px;border-radius:6px;font-size:10px;font-weight:bold;color:#fff}
.new{background:#ff2a6d} .out{background:#444} .neg{position:absolute;top:8px;right:8px;background:#ff9800;color:#fff;padding:4px 7px;border-radius:6px;font-size:10px;font-weight:bold}
.info{padding:8px} .info h4{font-size:12px;height:28px;overflow:hidden}
.price{font-weight:bold;font-size:14px} .old{color:#999;text-decoration:line-through;font-size:11px;margin-left:4px}
.meta{font-size:10px;color:#777;margin:4px 0}
.btn{width:100%;padding:10px;border:0;border-radius:8px;font-weight:bold;margin-top:5px;font-size:12px}
.btn-green{background:#25D366;color:#fff} .btn-black{background:#000;color:#fff}
.footer{background:#000;color:#aaa;padding:20px;text-align:center;font-size:12px;margin-top:10px}
.wa{position:fixed;bottom:20px;right:16px;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;z-index:999}
.ownerBtn{position:fixed;bottom:20px;left:16px;background:#ff2a6d;color:#fff;padding:12px 18px;border-radius:30px;font-weight:bold;z-index:999;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:1000;padding:15px;overflow:auto}
#panel input,#panel select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
</style>
</head>
<body>
<header><b>THRILL <span>FASHION</span></b><input id="search" placeholder="Search abaya, sweater..." oninput="show()"></header>
<div class="tags" id="tags"></div>
<div class="grid" id="grid"></div>

<div class="footer"><b style="color:#ff2a6d">THRILL FASHION STORE</b><br>📞 +256 792 350799 | Kampala<br>Jiji Style - Out of Stock | Negotiable | Views | Condition<br><br>© 2026 Thrill Fashion</div>

<a class="wa" href="https://wa.me/256792350799?text=Hello%20Thrill%20Fashion%20Store" target="_blank">💬</a>
<button class="ownerBtn" onclick="document.getElementById('panel').style.display='block'">⚙️ Owner Edit</button>

<div id="panel">
<h2>Owner Panel - Add Product</h2>
<p style="font-size:12px;color:#666;margin:6px 0">Your photo will appear instantly like Jiji</p>
<input id="pName" placeholder="Name: e.g. Maroon Abaya">
<input id="pPrice" placeholder="Price: UGX 145,000">
<input id="pOld" placeholder="Old price optional">
<select id="pCat"><option value="abaya">Abaya</option><option value="sweater">Sweaters</option><option value="skirt">Skirts</option><option value="trouser">Trousers</option><option value="dress">Dresses</option><option value="top">Tops</option></select>
<select id="pCond"><option>Brand New</option><option>New with tag</option><option>UK Used</option></select>
<input type="file" id="pFile" accept="image/*">
<div style="display:flex;gap:10px;margin:8px 0;font-size:13px">
<label><input type="checkbox" id="pOut"> Out of Stock</label>
<label><input type="checkbox" id="pNeg" checked> Negotiable</label>
</div>
<button class="btn btn-black" style="padding:14px" onclick="add()">+ ADD TO STORE</button>
<button class="btn" style="background:#eee" onclick="document.getElementById('panel').style.display='none'">Close & View Store</button>
<button class="btn" style="background:#ffe0e0;color:red;margin-top:10px" onclick="if(confirm('Delete all?')){localStorage.clear();location.reload();}">Clear All Products</button>
</div>

<script>
var defaultItems=[
{n:"Maroon Dubai Abaya - Gold",p:"UGX 145,000",old:"180k",c:"abaya",cond:"Brand New",neg:1,out:0,img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500"},
{n:"Beige Fur Sweater Warm",p:"UGX 85,000",old:"110k",c:"sweater",cond:"New with tag",neg:1,out:0,img:"https://images.unsplash.com/photo-1434389677669-e08b4cac3105?w=500"},
{n:"Pleated Skirt Gold Wave",p:"UGX 65,000",old:"85k",c:"skirt",cond:"Brand New",neg:0,out:1,img:"https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=500"},
{n:"Cargo Jeans Ladies",p:"UGX 70,000",old:"90k",c:"trouser",cond:"UK Used",neg:1,out:0,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=500"}
];

function getItems(){
try{
var saved=JSON.parse(localStorage.getItem('thrill')||'[]');
return saved.concat(defaultItems);
}catch(e){localStorage.clear(); return defaultItems;}
}

function show(){
var q=document.getElementById('search').value.toLowerCase();
var filter=window._filter||'';
var all=getItems();
var grid=document.getElementById('grid');
grid.innerHTML='';
for(var i=0;i<all.length;i++){
var it=all[i];
if(filter && it.c.indexOf(filter)==-1) continue;
if(q && it.n.toLowerCase().indexOf(q)==-1) continue;
var badge = it.out ? '<span class="badge out">OUT OF STOCK</span>' : '<span class="badge new">'+it.cond+'</span>';
var neg = it.neg ? '<span class="neg">Negotiable</span>' : '';
var opacity = it.out ? 'style="opacity:0.5"' : '';
var btnText = it.out ? 'Out of Stock - Ask When Back' : 'Order on WhatsApp';
var btnClass = it.out ? 'btn btn-black' : 'btn btn-green';
var msg = "Hello Thrill! I want "+it.n+" - "+it.p;
var card = '<div class="card">'+badge+neg+'<img src="'+it.img+'" '+opacity+'><div class="info"><h4>'+it.n+'</h4><div><span class="price">'+it.p+'</span><span class="old">'+(it.old||'')+'</span></div><div class="meta">📍 Kampala • 👁️ '+(50+Math.floor(Math.random()*200))+' views • '+it.cond+'</div><button class="'+btnClass+'" onclick="window.open(\'https://wa.me/256792350799?text='+encodeURIComponent(msg)+'\',\'_blank\')">'+btnText+'</button></div></div>';
grid.innerHTML+=card;
}
}

function add(){
var name=document.getElementById('pName').value;
var price=document.getElementById('pPrice').value;
var oldP=document.getElementById('pOld').value;
var cat=document.getElementById('pCat').value;
var cond=document.getElementById('pCond').value;
var out=document.getElementById('pOut').checked?1:0;
var neg=document.getElementById('pNeg').checked?1:0;
var file=document.getElementById('pFile').files[0];
if(!name||!price){alert('Enter name and price');return;}
if(!file){alert('Choose photo');return;}
var r=new FileReader();
r.onload=function(e){
var saved=JSON.parse(localStorage.getItem('thrill')||'[]');
saved.unshift({n:name,p:price,old:oldP,c:cat,cond:cond,out:out,neg:neg,img:e.target.result});
localStorage.setItem('thrill',JSON.stringify(saved));
document.getElementById('panel').style.display='none';
show();
alert('Added! Scroll to see it');
};
r.readAsDataURL(file);
}

function buildTags(){
var cats=['All','abaya','sweater','skirt','trouser','dress'];
var html='';
for(var i=0;i<cats.length;i++){
var active = (i==0&&!window._filter)||window._filter==cats[i] ? 'active' : '';
html+='<b class="'+active+'" onclick="window._filter=\''+(cats[i]=='All'?'':cats[i])+'\';buildTags();show();">'+cats[i]+'</b>';
}
document.getElementById('tags').innerHTML=html;
}

buildTags();
show();
</script>
</body>
  </html>
