<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UG LIVE TV - Official Streams</title>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial}
header{background:#111;padding:12px;display:flex;gap:8px;position:sticky;top:0;z-index:10}
header b{color:#ff2222;padding-top:10px}
input{flex:1;padding:11px;border-radius:10px;border:0;background:#222;color:#fff}
.notice{background:#1a1a00;color:#ffcc00;padding:10px;text-align:center;font-size:12px;border-bottom:1px solid #333}
iframe{width:100%;height:220px;border:0;background:#000}
.tags{display:flex;gap:8px;overflow:auto;padding:10px}
.tags b{background:#1e1e1e;padding:8px 14px;border-radius:20px;font-size:13px;white-space:nowrap;border:1px solid #2a2a2a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:linear-gradient(145deg,#1a1a1a,#161616);padding:16px;border-radius:14px;text-align:center;border:1px solid #2a2a2a}
.card small{display:block;margin-top:6px;font-size:11px}
.live{color:#ff3b3b} .web{color:#4caf50}
</style>
</head>
<body>
<header><b>UG LIVE</b><input id="s" placeholder="Search NTV, Bukedde, UBC..."></header>
<div class="notice">✅ Now using OFFICIAL website streams - tap to watch, no YouTube block</div>
<iframe id="player" src="https://www.ntv.co.ug/" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
<div class="tags">
<b onclick="f('')">All</b><b onclick="f('NTV')">NTV</b><b onclick="f('Bukedde')">Bukedde</b>
<b onclick="f('UBC')">UBC</b><b onclick="f('Spark')">Spark</b><b onclick="f('Wan')">Wan Luo</b>
</div>
<div class="grid" id="g"></div>
<script>
let ch=[
{n:"NTV Uganda - Official",url:"https://www.ntv.co.ug/ntv-live-stream",type:"Official Website"},
{n:"Bukedde TV 1 - Official",url:"https://www.bukedde.co.ug/",type:"Official Website"},
{n:"UBC TV Uganda - Official",url:"https://www.ubc.go.ug/",type:"Official Website"},
{n:"Spark TV Uganda",url:"https://www.sparktv.co.ug/",type:"Official Website"},
{n:"Baba TV Uganda",url:"https://babatv.co.ug/",type:"Official Website"},
{n:"Wan Luo TV - Acholi",url:"https://www.facebook.com/WanLuoTv/",type:"Facebook Live"}
];
let g=document.getElementById('g'), pl=document.getElementById('player');
function f(q){
g.innerHTML='';
ch.filter(c=>c.n.toLowerCase().includes(q.toLowerCase())).forEach(c=>{
let d=document.createElement('div');d.className='card';
d.innerHTML=c.n+'<small class='+(c.type.includes('Official')?'web':'live')+'>● '+c.type+' - Tap</small>';
d.onclick=()=>{
 // Try to load in player, and also open new tab as backup
 pl.src=c.url;
 window.open(c.url,'_blank');
 window.scrollTo(0,0);
};
g.appendChild(d);
});
}
f('');
document.getElementById('s').oninput=e=>f(e.target.value);
</script>
</body>
</html>
